# CyberHygiene Project Public Website
# Virtual Host Configuration for cyberinabox.net
#
# This configuration serves the public-facing CyberHygiene Project website
# on port 443 (HTTPS) using the existing wildcard SSL certificate.
#
# Created: November 13, 2025

<VirtualHost *:443>
    ServerName cyberinabox.net
    ServerAlias www.cyberinabox.net
    ServerAdmin don@contract-coach.com

    # Document Root
    DocumentRoot /var/www/cyberhygiene

    # SSL Configuration - Commercial SSL.com Wildcard Certificate
    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/commercial/wildcard.crt
    SSLCertificateKeyFile /etc/pki/tls/private/commercial/wildcard.key
    SSLCertificateChainFile /etc/pki/tls/certs/commercial/chain.pem

    # SSL Security Settings (FIPS Compatible)
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder on

    # HTTP Strict Transport Security (HSTS)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Additional Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "0"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Content Security Policy
    Header always set Content-Security-Policy "\
default-src 'none'; \
script-src 'self' 'unsafe-inline'; \
style-src 'self' 'unsafe-inline'; \
img-src 'self'; \
font-src 'self'; \
connect-src 'self'; \
form-action 'self'; \
frame-ancestors 'self'; \
base-uri 'self'; \
object-src 'none'"

    # Permissions Policy - restrict unnecessary browser APIs
    Header always set Permissions-Policy "\
geolocation=(), \
camera=(), \
microphone=(), \
payment=(), \
usb=(), \
magnetometer=(), \
gyroscope=(), \
accelerometer=()"

    # Directory Configuration
    <Directory /var/www/cyberhygiene>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Disable directory listings
        Options -Indexes

        # Set default index file
        DirectoryIndex index.html

        # Enable compression
        <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
            AddOutputFilterByType DEFLATE application/javascript application/json
        </IfModule>
    </Directory>

    # Cache Control for Static Assets
    <FilesMatch "\.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$">
        Header set Cache-Control "max-age=2592000, public"
    </FilesMatch>

    # HTML files - shorter cache
    <FilesMatch "\.(html|htm)$">
        Header set Cache-Control "max-age=3600, public"
    </FilesMatch>

    # Disable caching for Policy_Index.html to ensure latest version is always served
    <Files "Policy_Index.html">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </Files>

    # Disable caching for policy_data.json to ensure dynamic updates work
    <Files "policy_data.json">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </Files>

    # Disable caching for AI dashboard to ensure updates are immediate
    <Files "ai-dashboard.html">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </Files>

    # Logging
    ErrorLog /var/log/httpd/cyberhygiene-error.log
    CustomLog /var/log/httpd/cyberhygiene-access.log combined

    # Log SSL protocol and cipher
    CustomLog /var/log/httpd/cyberhygiene-ssl.log \
              "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"

    # AI API Proxy - Added 2025-12-23
    # Proxies HTTPS requests to HTTP Ollama server for CMMC compliance

    # Handle OPTIONS requests before proxying
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteCond %{REQUEST_URI} ^/ai-api
    RewriteRule .* - [R=200,L]

    ProxyPass /ai-api http://ai.cyberinabox.net:11434
    ProxyPassReverse /ai-api http://ai.cyberinabox.net:11434

    <Location /ai-api>
        Require all granted
        ProxyPreserveHost Off

        # Remove Origin header before proxying (causes 403)
        RequestHeader unset Origin

        # CORS headers for all requests
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type, Accept, Origin"
        Header always set Access-Control-Max-Age "3600"

        # No caching for API responses
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </Location>

    # Aider API Proxy - Added 2025-12-24
    # Proxies HTTPS requests to local Aider service for file editing capabilities

    ProxyPass /aider-api http://127.0.0.1:5001
    ProxyPassReverse /aider-api http://127.0.0.1:5001

    <Location /aider-api>
        Require all granted
        ProxyPreserveHost Off

        # CORS headers
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type, Accept"
        Header always set Access-Control-Max-Age "3600"

        # No caching
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </Location>
</VirtualHost>

# Redirect HTTP to HTTPS
<VirtualHost *:80>
    ServerName cyberinabox.net
    ServerAlias www.cyberinabox.net

    # Redirect all HTTP traffic to HTTPS
    Redirect permanent / https://cyberinabox.net/

    ErrorLog /var/log/httpd/cyberhygiene-redirect-error.log
    CustomLog /var/log/httpd/cyberhygiene-redirect-access.log combined
</VirtualHost>
