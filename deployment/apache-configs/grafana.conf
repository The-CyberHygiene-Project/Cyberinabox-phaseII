# Grafana Reverse Proxy Configuration
# Created: 2026-01-18

<VirtualHost *:443>
    ServerName grafana.cyberinabox.net
    ServerAdmin don@contract-coach.com

    # SSL Configuration - Commercial SSL.com Wildcard Certificate
    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/commercial/wildcard.crt
    SSLCertificateKeyFile /etc/pki/tls/private/commercial/wildcard.key
    SSLCertificateChainFile /etc/pki/tls/certs/commercial/chain.pem

    # SSL Security Settings
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder on

    # Proxy to Grafana on localhost:3000
    ProxyPreserveHost On
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/

    # WebSocket support for Grafana Live
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://localhost:3000/$1 [P,L]

    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"

    # Logging
    ErrorLog /var/log/httpd/grafana-error.log
    CustomLog /var/log/httpd/grafana-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName grafana.cyberinabox.net
    Redirect permanent / https://grafana.cyberinabox.net/
</VirtualHost>
