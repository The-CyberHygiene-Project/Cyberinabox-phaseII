# Internal Dashboards - Only accessible via dc1.cyberinabox.net
# These dashboards are NOT publicly accessible
# Created: 2026-01-18

# Alias to serve dashboards at /dashboard/ path on dc1
Alias /dashboard /var/www/internal-dashboards

<Directory /var/www/internal-dashboards>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    
    # Only allow access from internal networks
    <RequireAny>
        Require ip 192.168.1.0/24
        Require ip 127.0.0.1
        Require ip ::1
    </RequireAny>
    
    DirectoryIndex switchboard.html
</Directory>

# Block external access explicitly
<Location /dashboard>
    <RequireAny>
        Require ip 192.168.1.0/24
        Require ip 127.0.0.1
        Require ip ::1
    </RequireAny>
</Location>
