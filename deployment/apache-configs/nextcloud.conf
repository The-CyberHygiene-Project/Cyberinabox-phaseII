# Nextcloud - Internal Access Only
# NIST 800-171 Compliant - Restricted to internal network
# Created: January 19, 2026

<VirtualHost *:443>
    ServerName nextcloud.cyberinabox.net
    ServerAdmin admin@cyberinabox.net
    DocumentRoot /var/www/nextcloud

    # SSL Configuration - Commercial SSL.com Wildcard Certificate
    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/commercial/wildcard.crt
    SSLCertificateKeyFile /etc/pki/tls/private/commercial/wildcard.key
    SSLCertificateChainFile /etc/pki/tls/certs/commercial/chain.pem

    # SSL Security Settings (FIPS Compatible)
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder on

    # Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    <Directory /var/www/nextcloud>
        Options +FollowSymlinks
        AllowOverride All

        # INTERNAL ACCESS ONLY - NIST 800-171 Compliant
        <RequireAny>
            Require ip 192.168.1.0/24
            Require ip 127.0.0.1
            Require ip ::1
        </RequireAny>

        <IfModule mod_dav.c>
            Dav off
        </IfModule>

        SetEnv HOME /var/www/nextcloud
        SetEnv HTTP_HOME /var/www/nextcloud
    </Directory>

    # Logging
    ErrorLog /var/log/httpd/nextcloud-error.log
    CustomLog /var/log/httpd/nextcloud-access.log combined
</VirtualHost>

# Redirect HTTP to HTTPS (internal only)
<VirtualHost *:80>
    ServerName nextcloud.cyberinabox.net

    <Location />
        # Only allow redirect from internal network
        <RequireAny>
            Require ip 192.168.1.0/24
            Require ip 127.0.0.1
            Require ip ::1
        </RequireAny>
    </Location>

    Redirect permanent / https://nextcloud.cyberinabox.net/
</VirtualHost>
