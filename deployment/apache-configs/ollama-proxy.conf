# Ollama API Reverse Proxy
# Allows the AI dashboard to communicate with Ollama without CORS issues
# Connection pooling configured to prevent multiple concurrent connections

<IfModule mod_proxy.c>
    ProxyPreserveHost On
    ProxyTimeout 300

    # Connection pooling settings to prevent multiple connections
    # Only allow 1 connection per worker, reuse connections
    ProxyPass /api/ollama http://192.168.1.7:11434 keepalive=On smax=1 max=2 ttl=300 retry=30
    ProxyPassReverse /api/ollama http://192.168.1.7:11434

    # Enable HTTP/1.1 keepalive for connection reuse
    SetEnv proxy-nokeepalive 0
    SetEnv proxy-initial-not-pooled 0

    <Location /api/ollama>
        # Allow access from local network only
        Require ip 192.168.1.0/24
        Require local
    </Location>
</IfModule>
