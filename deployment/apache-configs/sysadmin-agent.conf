# SysAdmin Agent Dashboard - Reverse Proxy Configuration
# Proxies HTTPS requests to Streamlit app on localhost:8501
# NIST 800-171 / CMMC Compliant - Internal access only
# Created: 2026-01-24

# Enable required proxy modules (loaded in httpd.conf)
# LoadModule proxy_module modules/mod_proxy.so
# LoadModule proxy_http_module modules/mod_proxy_http.so
# LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so

<Location /sysadmin>
    # Only allow access from internal networks
    <RequireAny>
        Require ip 192.168.1.0/24
        Require ip 127.0.0.1
        Require ip ::1
    </RequireAny>

    # Proxy to Streamlit
    ProxyPass http://127.0.0.1:8501/sysadmin
    ProxyPassReverse http://127.0.0.1:8501/sysadmin
</Location>

# WebSocket support for Streamlit
<Location /sysadmin/_stcore/stream>
    <RequireAny>
        Require ip 192.168.1.0/24
        Require ip 127.0.0.1
        Require ip ::1
    </RequireAny>

    ProxyPass ws://127.0.0.1:8501/sysadmin/_stcore/stream
    ProxyPassReverse ws://127.0.0.1:8501/sysadmin/_stcore/stream
</Location>

# Static assets
<Location /sysadmin/static>
    <RequireAny>
        Require ip 192.168.1.0/24
        Require ip 127.0.0.1
        Require ip ::1
    </RequireAny>

    ProxyPass http://127.0.0.1:8501/sysadmin/static
    ProxyPassReverse http://127.0.0.1:8501/sysadmin/static
</Location>

# Healthcheck endpoint
<Location /sysadmin/healthz>
    <RequireAny>
        Require ip 192.168.1.0/24
        Require ip 127.0.0.1
        Require ip ::1
    </RequireAny>

    ProxyPass http://127.0.0.1:8501/sysadmin/healthz
    ProxyPassReverse http://127.0.0.1:8501/sysadmin/healthz
</Location>
